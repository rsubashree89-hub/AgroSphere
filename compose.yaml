services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_PORT: "4000"
    expose:
      - "4000"
    volumes:
      - crop-health-images:/app/server/storage/crop-health
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    command: ["node", "server/dist/db/migrate.js"]
    profiles:
      - tools

  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    environment:
      PLANT_ID_API_KEY: ${PLANT_ID_API_KEY:-}
    expose:
      - "8000"
    profiles:
      - ai
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  crop-health-images:
